name: Automation Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "Select execution mode"
        required: true
        type: choice
        options:
          - full
          - k8s-only
        default: full

      image_tag:
        description: "Existing image tag. Required for k8s-only."
        required: false
        type: string


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hybrid_automation_framework


jobs:

  # ============================================================
  # 1. RUN TESTS ON GITHUB RUNNER
  # ============================================================

  runner-tests:

    name: Runner Test Execution

    if: |
      github.event_name == 'push' ||
      github.event.inputs.execution_mode == 'full'

    runs-on: ubuntu-latest

    outputs:
      test_status: ${{ steps.test_status.outputs.status }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v6


      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      - name: Run automation tests
        id: test_status
        run: |
          mvn clean test -Denv=qa


      - name: Generate Allure report
        if: always()
        run: |
          mvn allure:report


      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-cucumber-report
          path: target/cucumber-report.html
          if-no-files-found: warn


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-allure-results
          path: target/allure-results/
          if-no-files-found: warn


      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-scenario-logs
          path: target/logs/
          if-no-files-found: warn


  # ============================================================
  # 2. BUILD + PUSH DOCKER IMAGE
  # ============================================================

  build-image:

    name: Build and Push Docker Image

    needs: runner-tests

    if: |
      needs.runner-tests.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.execution_mode == 'full'
      )

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v6


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Define image
        id: image
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building image:"
          echo "${IMAGE}"


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}

  # ============================================================
  # 3. RESOLVE IMAGE FOR KUBERNETES
  # ============================================================

  resolve-image:

    name: Resolve Kubernetes Image

    needs:
      - runner-tests
      - build-image

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.runner-tests.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.execution_mode == 'full' &&
          needs.runner-tests.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.execution_mode == 'k8s-only' &&
          github.event.inputs.image_tag != ''
        )
      )

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.resolve.outputs.image }}

    steps:

      - name: Resolve image
        id: resolve
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ github.event.inputs.execution_mode }}" == "k8s-only" ]]; then

            IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"

          else

            IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          fi

          echo "Using image:"
          echo "${IMAGE}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 4. KUBERNETES EXECUTION
  # ============================================================

  # ============================================================
  # 4. KUBERNETES EXECUTION
  # ============================================================

  k8s-tests:
    name: Kubernetes Test Execution
    needs: resolve-image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Setup Minikube
      # ----------------------------------------------------------

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest

      - name: Start Minikube
        run: |
          minikube start --driver=docker

      # ----------------------------------------------------------
      # Verify Kubernetes
      # ----------------------------------------------------------

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get storageclass

      # ----------------------------------------------------------
      # Kubernetes namespace
      # ----------------------------------------------------------

      - name: Create automation namespace
        run: |
          kubectl create namespace automation \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ----------------------------------------------------------
      # GHCR authentication
      # ----------------------------------------------------------

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace automation \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ----------------------------------------------------------
      # Display image
      # ----------------------------------------------------------

      - name: Display image
        run: |
          echo "Kubernetes will execute:"
          echo "${{ needs.resolve-image.outputs.image }}"
