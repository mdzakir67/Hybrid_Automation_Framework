name: Automation Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "Select execution mode"
        required: true
        type: choice
        options:
          - full
          - k8s-only
        default: full

      image_tag:
        description: "Existing image tag. Required for k8s-only."
        required: false
        type: string


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hybrid_automation_framework


jobs:

  # ============================================================
  # 1. RUN TESTS ON GITHUB RUNNER
  # ============================================================

  runner-tests:

    name: Runner Test Execution

   if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          github.event.inputs.execution_mode == 'full' ||
          (
            github.event.inputs.execution_mode == 'k8s-only' &&
            github.event.inputs.image_tag != ''
          )
        )
      )

    runs-on: ubuntu-latest

    outputs:
      test_status: ${{ steps.test_status.outputs.status }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v6


      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      - name: Run automation tests
        id: test_status
        run: |
          mvn clean test -Denv=qa


      - name: Generate Allure report
        if: always()
        run: |
          mvn allure:report


      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-cucumber-report
          path: target/cucumber-report.html
          if-no-files-found: warn


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-allure-results
          path: target/allure-results/
          if-no-files-found: warn


      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-scenario-logs
          path: target/logs/
          if-no-files-found: warn


  # ============================================================
  # 2. BUILD + PUSH DOCKER IMAGE
  # ============================================================

  build-image:

    name: Build and Push Docker Image

    needs: runner-tests

    if: |
      needs.runner-tests.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.execution_mode == 'full'
      )

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout source
        uses: actions/checkout@v6


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Define image
        id: image
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building image:"
          echo "${IMAGE}"


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}

  # ============================================================
  # 3. RESOLVE IMAGE FOR KUBERNETES
  # ============================================================

  resolve-image:

    name: Resolve Kubernetes Image

    needs:
      - runner-tests
      - build-image

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.runner-tests.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.execution_mode == 'full' &&
          needs.runner-tests.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.execution_mode == 'k8s-only' &&
          github.event.inputs.image_tag != ''
        )
      )

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.resolve.outputs.image }}

    steps:

      - name: Resolve image
        id: resolve
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ github.event.inputs.execution_mode }}" == "k8s-only" ]]; then

            IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ github.event.inputs.image_tag }}"

          else

            IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          fi

          echo "Using image:"
          echo "${IMAGE}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 4. KUBERNETES EXECUTION
  # ============================================================

  # ============================================================
  # 4. KUBERNETES EXECUTION
  # ============================================================

  k8s-tests:
    name: Kubernetes Test Execution
    needs: resolve-image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Setup Minikube
      # ----------------------------------------------------------

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest

      - name: Start Minikube
        run: |
          minikube start --driver=docker

      # ----------------------------------------------------------
      # Verify Kubernetes
      # ----------------------------------------------------------

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get storageclass

      # ----------------------------------------------------------
      # Kubernetes namespace
      # ----------------------------------------------------------

      - name: Create automation namespace
        run: |
          kubectl create namespace automation \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ----------------------------------------------------------
      # GHCR authentication
      # ----------------------------------------------------------

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace automation \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Verify checkout
        run: |
          echo "Current directory:"
          pwd
      
          echo ""
          echo "Repository contents:"
          ls -la
      
          echo ""
          echo "k8s-template:"
          ls -la k8s-template
      
          echo ""
          echo "k8s:"
          ls -la k8s

      - name: Prepare Kubernetes manifests
        env:
          IMAGE: ${{ needs.resolve-image.outputs.image }}
          PVC_NAME: automation-results-${{ github.run_id }}
          JOB_NAME: automation-tests-${{ github.run_id }}
        run: |
          envsubst < k8s-template/allure-results-pvc.yaml.template \
            > /tmp/allure-results-pvc.yaml

          envsubst < k8s-template/automation-tests.yaml.template \
            > /tmp/automation-tests.yaml

      - name: Verify Kubernetes manifests
        run: |
          echo "===== PVC ====="
          cat /tmp/allure-results-pvc.yaml

          echo ""
          echo "===== JOB ====="
          cat /tmp/automation-tests.yaml

      - name: Create test results PVC
        run: |
          kubectl apply -f /tmp/allure-results-pvc.yaml

      - name: Verify PVC
        run: |
          kubectl get pvc -n automation
          kubectl get pv

      - name: Create automation Job
        run: |
          kubectl apply -f /tmp/automation-tests.yaml


      - name: Verify Kubernetes Job
        run: |
          kubectl get jobs -n automation
          kubectl get pods -n automation

      - name: Wait for automation Job
        run: |
          JOB_NAME="automation-tests-${GITHUB_RUN_ID}"

          set +e

          kubectl wait \
            --for=condition=complete \
            --timeout=20m \
            "job/${JOB_NAME}" \
            -n automation

          WAIT_STATUS=$?

          echo "kubectl wait exit code: ${WAIT_STATUS}"

          echo "===== Job Status ====="
          kubectl get job "${JOB_NAME}" -n automation

          echo ""
          echo "===== Pod Status ====="
          kubectl get pods -n automation -l "job-name=${JOB_NAME}"

          echo ""
          echo "===== Job Logs ====="
          kubectl logs \
            -n automation \
            -l "job-name=${JOB_NAME}" \
            --all-containers=true \
            --tail=-1

          if [[ ${WAIT_STATUS} -ne 0 ]]; then
            echo "Kubernetes automation Job did not complete successfully."
            exit 1
          fi

          echo "Kubernetes automation Job completed successfully."

      - name: Collect Allure results
        run: |
          PVC_NAME="automation-results-${GITHUB_RUN_ID}"
          COLLECTOR_NAME="allure-results-collector-${GITHUB_RUN_ID}"
          
          cat > /tmp/allure-results-collector.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${COLLECTOR_NAME}
            namespace: automation
          spec:
            restartPolicy: Never
          
            containers:
              - name: collector
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - |
                    cp -R /results/. /output/
                    echo "Allure results copied successfully."
                    sleep 120
          
                volumeMounts:
                  - name: allure-results
                    mountPath: /results
          
                  - name: output
                    mountPath: /output
          
            volumes:
              - name: allure-results
                persistentVolumeClaim:
                  claimName: ${PVC_NAME}
          
              - name: output
                hostPath:
                  path: /tmp/allure-results
                  type: DirectoryOrCreate
          EOF
          
          kubectl apply -f /tmp/allure-results-collector.yaml

      - name: Wait for Allure collector
        run: |
          COLLECTOR_NAME="allure-results-collector-${GITHUB_RUN_ID}"

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Running \
            --timeout=2m \
            "pod/${COLLECTOR_NAME}" \
            -n automation

      - name: Copy Allure results to GitHub runner
        run: |
          COLLECTOR_NAME="allure-results-collector-${GITHUB_RUN_ID}"

          mkdir -p allure-results

          kubectl cp \
            "automation/${COLLECTOR_NAME}:/output/." \
            ./allure-results/

          echo "===== Collected Allure Results ====="
          find allure-results -type f | sort

      - name: Upload Kubernetes Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-allure-results
          path: allure-results/
          if-no-files-found: warn

      - name: Delete Allure collector
        if: always()
        run: |
          COLLECTOR_NAME="allure-results-collector-${GITHUB_RUN_ID}"

          kubectl delete pod \
            "${COLLECTOR_NAME}" \
            -n automation \
            --ignore-not-found
