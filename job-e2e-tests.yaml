apiVersion: batch/v1
kind: Job
metadata:
  name: hybrid-e2e-tests
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hybrid-e2e
          image: your-registry/hybrid-automation:latest  # replace with built image
          imagePullPolicy: IfNotPresent
          env:
            - name: BROWSER
              value: "chrome"
            - name: SELENIUM_REMOTE_URL
              value: "http://selenium-grid:4444/wd/hub" # point to your selenium grid/standalone
            - name: HEADLESS
              value: "true"
            - name: ALLURE_RESULTS_DIR
              value: "/results"
          volumeMounts:
            - name: allure-results
              mountPath: /results
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: allure-results
          persistentVolumeClaim:
            claimName: allure-results-pvc
